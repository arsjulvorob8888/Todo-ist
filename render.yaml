services:
  - type: web
    name: poryadok
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poryadok-db
          property: connectionString
      - key: BETTER_AUTH_URL
        sync: false

databases:
  - name: poryadok-db
    plan: free
    databaseName: poryadok
    user: poryadok
