name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # App tests only. scripts/**/*.test.mjs is `npm run test:platform` and
      # needs the gitignored .grok sandbox, which a GitHub checkout does not have.
      - run: npm test
